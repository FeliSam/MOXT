# Réinitialisation mot de passe Auth (ops) — secrets GitHub requis :
#   SUPABASE_ACCESS_TOKEN, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY

name: Admin — reset user password

on:
  workflow_dispatch:
    inputs:
      phone:
        description: 'Numéro E.164 (+7999...)'
        required: false
        default: ''
      email:
        description: 'E-mail du compte'
        required: false
        default: ''
      user_id:
        description: 'UUID utilisateur (optionnel)'
        required: false
        default: ''
      password:
        description: 'Nouveau mot de passe'
        required: true

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Reset password and verify login
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          args=(--password "${{ inputs.password }}")
          if [ -n "${{ inputs.phone }}" ]; then args+=(--phone "${{ inputs.phone }}"); fi
          if [ -n "${{ inputs.email }}" ]; then args+=(--email "${{ inputs.email }}"); fi
          if [ -n "${{ inputs.user_id }}" ]; then args+=(--user-id "${{ inputs.user_id }}"); fi
          node scripts/reset-user-password.mjs "${args[@]}"
