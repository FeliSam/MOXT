#cloud-config
package_update: true
packages:
  - docker.io
runcmd:
  - systemctl enable docker
  - systemctl start docker
  - docker pull libretranslate/libretranslate
  - docker rm -f libretranslate 2>/dev/null || true
  - docker run -d --name libretranslate --restart unless-stopped -p 5000:5000 libretranslate/libretranslate --load-only fr,en,ru,pt,es --api-keys "ff2ddc17ced269d05c346da78ca79cd1"
